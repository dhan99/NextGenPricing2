kind = "web"
previewPath = "/v2/"
title = "Surety Bond Portal v2"
version = "1.0.0"
id = "artifacts/surety-bond-v2"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/v2/" ]
localPort = 21118

[services.development]
run = "pnpm --filter @workspace/surety-bond-v2 run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/surety-bond-v2", "run", "build" ]
publicDir = "artifacts/surety-bond-v2/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21118"
BASE_PATH = "/v2/"
